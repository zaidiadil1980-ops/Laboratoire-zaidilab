<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12306b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZaidiLab">
<title>ZaidiLab — Analyses Médicales Tanger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#12306b;--blue:#2257a8;--sky:#3a8bff;--teal:#14b8a6;--gold:#e0b84a;
  --bg:#f3f7fc;--card:#fff;--text:#14213d;--muted:#64748b;--line:#e3eaf4;
  --ok:#16a34a;--okbg:#dcfce7;--err:#dc2626;--errbg:#fee2e2;--wa:#25D366;
  --r:20px;--shadow:0 8px 26px rgba(18,48,107,.10)
}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,Tahoma,sans-serif;background:linear-gradient(180deg,#e8f0fb 0%,var(--bg) 260px);color:var(--text);min-height:100vh;padding-bottom:96px;line-height:1.45}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
button{font-family:inherit;cursor:pointer;border:none}
button:active{transform:scale(.97)}
a{color:inherit;text-decoration:none}

/* TOP BAR */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(243,247,252,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(18,48,107,.06)}
.top img{width:44px;height:44px;border-radius:13px;background:#fff;padding:4px;box-shadow:0 3px 10px rgba(18,48,107,.15);object-fit:contain}
.badge{display:block;width:196px;height:196px;margin:2px auto 14px;border-radius:50%;box-shadow:0 0 0 5px rgba(255,255,255,.25),0 14px 34px rgba(0,0,0,.35);animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hero.c{text-align:center}.hero.c h1,.hero.c p{max-width:100%;margin-inline:auto}.hero.c .cta{justify-content:center}
.top b{font-size:15px;color:var(--navy);flex:1;letter-spacing:.2px}
.langs{display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:0 2px 8px rgba(18,48,107,.1)}
.langs button{background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;transition:.2s}
.langs button.on{background:var(--navy);color:#fff}

/* PAGES */
.page{display:none;padding:14px 14px 20px;animation:up .45s ease both}
.page.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2.t{font-size:22px;color:var(--navy);margin:6px 2px 4px;font-weight:800}
p.s{font-size:13px;color:var(--muted);margin:0 2px 14px}

/* HERO */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 20px;color:#fff;background:linear-gradient(135deg,#0f2a60 0%,#2257a8 55%,#1aa6c9 100%);box-shadow:0 14px 34px rgba(18,48,107,.32)}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.35;animation:float 9s ease-in-out infinite}
.b1{width:170px;height:170px;background:#14b8a6;top:-60px;inset-inline-end:-40px}
.b2{width:120px;height:120px;background:#e0b84a;bottom:-50px;inset-inline-start:-30px;animation-delay:-3s}
.fl{position:absolute;font-size:26px;opacity:.9;animation:float 6s ease-in-out infinite}
.f1{top:16px;inset-inline-end:18px}.f2{top:78px;inset-inline-end:62px;animation-delay:-2s;font-size:20px}.f3{top:46px;inset-inline-end:108px;animation-delay:-4s;font-size:17px}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(6deg)}}
.hero>*:not(.blob):not(.fl){position:relative}
.hello{font-size:13px;opacity:.85;margin-bottom:6px}
.hero h1{font-size:26px;line-height:1.2;font-weight:800;margin-bottom:8px;max-width:88%}
.hero p{font-size:13.5px;opacity:.9;margin-bottom:16px;max-width:90%}
.status{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:6px 12px;border-radius:999px;font-size:12px;margin-bottom:16px}
.dot{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 1.8s infinite}
.dot.off{background:#fbbf24;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}100%{box-shadow:0 0 0 12px rgba(74,222,128,0)}}
.cta{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:16px;font-size:14.5px;font-weight:700;transition:.2s}
.btn-w{background:#fff;color:var(--navy);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.btn-g{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn-n{background:var(--navy);color:#fff}
.btn-wa{background:var(--wa);color:#fff}
.btn-t{background:var(--teal);color:#fff}
.btn-l{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.full{width:100%}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}
.stat{background:var(--card);border-radius:18px;padding:13px 8px;text-align:center;box-shadow:var(--shadow)}
.stat i{font-style:normal;font-size:24px;display:block;margin-bottom:3px}
.stat span{font-size:11.5px;font-weight:700;color:var(--navy)}

/* SECTION */
.sec{font-size:16px;font-weight:800;color:var(--navy);margin:20px 2px 10px;display:flex;align-items:center;gap:8px}
.chips{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.disc{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--card);padding:10px 14px;border-radius:16px;box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--navy);white-space:nowrap}
.disc i{font-style:normal;font-size:20px}
.steps{display:grid;gap:10px}
.step{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.step .n{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--sky));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
.step b{display:block;font-size:14px;color:var(--navy)}
.step span{font-size:12.5px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{font-size:15px;color:var(--navy);margin-bottom:5px;display:flex;gap:8px;align-items:center}
.card p{font-size:13px;color:var(--muted);margin-bottom:12px}
.grad{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}
.grad h3,.grad p{color:#fff}.grad p{opacity:.92}
.grad2{background:linear-gradient(135deg,#7c3aed,#3a8bff);color:#fff}
.grad2 h3,.grad2 p{color:#fff}.grad2 p{opacity:.92}
.hours{width:100%;font-size:13px;border-collapse:collapse;margin-bottom:12px}
.hours td{padding:7px 0;border-bottom:1px dashed var(--line)}
.hours td:last-child{text-align:end;font-weight:700;color:var(--navy)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* TESTS */
.search{width:100%;padding:14px 16px;border-radius:16px;border:2px solid transparent;background:var(--card);font-size:15px;box-shadow:var(--shadow);margin-bottom:12px;font-family:inherit;color:var(--text)}
.search:focus{outline:none;border-color:var(--sky)}
.cat{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.cat::-webkit-scrollbar{display:none}
.cat button{flex:0 0 auto;background:var(--card);color:var(--muted);padding:9px 14px;border-radius:999px;font-size:12.5px;font-weight:700;box-shadow:0 3px 10px rgba(18,48,107,.07)}
.cat button.on{background:var(--navy);color:#fff}
.test{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);border:2px solid transparent;transition:.2s}
.test.sel{border-color:var(--teal);background:#f0fdfa}
.test .ic{width:42px;height:42px;border-radius:13px;background:#eef4ff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.test .in{flex:1;min-width:0}
.test b{display:block;font-size:14px;color:var(--text)}
.test small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.price{font-size:13px;font-weight:800;color:var(--navy);white-space:nowrap}
.add{width:36px;height:36px;border-radius:12px;background:var(--navy);color:#fff;font-size:20px;font-weight:700;flex:0 0 auto;transition:.2s}
.test.sel .add{background:var(--teal)}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:40;display:none;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;box-shadow:0 12px 30px rgba(18,48,107,.4);font-size:13.5px;font-weight:700;animation:pop .35s ease}
.pill.on{display:flex}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

/* FORM */
.fl2{display:block;font-size:11px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin:0 0 5px}
.fi{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:#fbfdff;font-size:15px;margin-bottom:12px;font-family:inherit;color:var(--text);-webkit-appearance:none}
.fi:focus{outline:none;border-color:var(--sky);background:#fff}
textarea.fi{resize:none;min-height:72px}
.gps{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border-radius:14px;border:2px dashed #9cc4ff;background:#f3f8ff;color:var(--navy);font-weight:700;font-size:14px;margin-bottom:12px}
.gps.ok{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.slot{padding:11px;border-radius:13px;background:#fbfdff;border:2px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.slot.on{border-color:var(--sky);background:#eaf3ff;color:var(--navy)}
.mini{display:flex;justify-content:space-between;align-items:center;background:#f3f8ff;border-radius:12px;padding:9px 12px;margin-bottom:7px;font-size:13px}
.mini button{background:transparent;color:var(--err);font-size:18px;padding:0 4px}
.tot{display:flex;justify-content:space-between;font-weight:800;color:var(--navy);padding:10px 4px 14px;font-size:15px}
.msg{display:none;padding:12px;border-radius:14px;font-size:13px;text-align:center;margin-bottom:10px;font-weight:600}
.msg.err{background:var(--errbg);color:var(--err);display:block}

/* GUIDE */
.acc{background:var(--card);border-radius:18px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.acc button.q{width:100%;display:flex;align-items:center;gap:12px;padding:15px;background:transparent;text-align:start;font-size:14px;font-weight:700;color:var(--navy)}
.acc .ei{font-size:22px}
.acc .ar{margin-inline-start:auto;transition:.25s;color:var(--muted)}
.acc.open .ar{transform:rotate(180deg)}
.acc .a{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 16px;font-size:13.5px;color:#334155}
.acc.open .a{max-height:420px;padding:0 16px 16px}
.note{background:#fff8e1;border:1px solid #fde7a0;color:#7a5b00;border-radius:16px;padding:12px 14px;font-size:12.5px;margin-top:8px}

/* CHAT */
.chat{display:flex;flex-direction:column;gap:9px;min-height:260px;max-height:48vh;overflow-y:auto;padding:4px 2px 10px}
.bub{max-width:86%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-wrap;animation:up .3s ease}
.bub.bot{background:var(--card);box-shadow:var(--shadow);align-self:flex-start;border-end-start-radius:6px}
.bub.me{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;align-self:flex-end;border-end-end-radius:6px}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#94a3b8;margin:0 2px;animation:bl 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
.sug{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.sug::-webkit-scrollbar{display:none}
.sug button{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);color:var(--navy);padding:9px 13px;border-radius:999px;font-size:12.5px;font-weight:700}
.send{display:flex;gap:8px}
.send input{flex:1;margin:0}
.send button{width:50px;border-radius:14px;background:var(--navy);color:#fff;font-size:18px}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:50;display:flex;align-items:flex-end;justify-content:space-around;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(18,48,107,.1)}
.nav button{flex:1;background:transparent;color:#94a3b8;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;transition:.2s}
.nav button i{font-style:normal;font-size:22px;filter:grayscale(1);opacity:.6;transition:.2s}
.nav button.on{color:var(--navy)}
.nav button.on i{filter:none;opacity:1;transform:translateY(-2px) scale(1.12)}
.nav .mid{flex:0 0 auto;margin:0 6px}
.nav .mid i{width:56px;height:56px;border-radius:20px;background:linear-gradient(135deg,var(--teal),var(--sky));display:flex;align-items:center;justify-content:center;filter:none;opacity:1;font-size:26px;margin-top:-26px;box-shadow:0 10px 22px rgba(20,184,166,.5);border:4px solid #fff}
.nav .mid.on i{transform:translateY(0) scale(1.06)}
.foot{text-align:center;font-size:11.5px;color:var(--muted);padding:18px 10px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

<div class="top">
  <img id="logo" alt="ZaidiLab">
  <b>ZaidiLab · زايدي لاب</b>
  <div class="langs">
    <button data-l="fr" onclick="setLang('fr')">FR</button>
    <button data-l="ar" onclick="setLang('ar')">ع</button>
    <button data-l="es" onclick="setLang('es')">ES</button>
  </div>
</div>

<!-- HOME -->
<section class="page on" id="p-home">
  <div class="hero c">
    <div class="blob b1"></div><div class="blob b2"></div>
    <img class="badge" id="badge" alt="ZaidiLab مختبر التحاليل الطبية">
    <div class="hello" data-i="hello"></div>
    <h1 data-i="h1"></h1>
    <p data-i="hsub"></p>
    <div class="status"><span class="dot" id="dot"></span><span id="stat"></span></div>
    <div class="cta">
      <button class="btn btn-w" onclick="go('request')">🏠 <span data-i="cta1"></span></button>
      <button class="btn btn-g" onclick="go('tests')">🧪 <span data-i="cta2"></span></button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><i>🏠</i><span data-i="s1"></span></div>
    <div class="stat"><i>⚡</i><span data-i="s2"></span></div>
    <div class="stat"><i>🔒</i><span data-i="s3"></span></div>
  </div>

  <div class="sec">✨ <span data-i="dtitle"></span></div>
  <div class="chips" id="discs"></div>

  <div class="sec">🚀 <span data-i="how"></span></div>
  <div class="steps" id="steps"></div>

  <div class="sec">📍 <span data-i="more"></span></div>
  <div class="card grad">
    <h3>📄 <span data-i="res_t"></span></h3>
    <p data-i="res_d"></p>
    <button class="btn btn-w full" onclick="wa(T().res_msg)">💬 <span data-i="res_b"></span></button>
  </div>
  <div class="card grad2">
    <h3>🩺 <span data-i="doc_t"></span></h3>
    <p data-i="doc_d"></p>
    <button class="btn btn-w full" onclick="wa(T().doc_msg)">💬 <span data-i="doc_b"></span></button>
  </div>

  <div class="card">
    <h3>🕐 <span data-i="hrs"></span></h3>
    <table class="hours">
      <tr><td data-i="wk"></td><td>07:30 – 21:00</td></tr>
      <tr><td data-i="we"></td><td>08:00 – 18:00</td></tr>
    </table>
    <div class="row">
      <a class="btn btn-n" href="tel:+212601501476">📞 <span data-i="call"></span></a>
      <button class="btn btn-wa" onclick="wa('')">💬 WhatsApp</button>
    </div>
    <p style="margin:12px 0 10px">📍 <span data-i="addr"></span></p>
    <a class="btn btn-l full" target="_blank" rel="noopener" href="https://maps.google.com/?q=ZaidiLab+Tanger+Avenue+Moulay+Ali+Chrif+278">🗺️ <span data-i="map"></span></a>
    <p style="margin:12px 0 0;font-size:12px">☎️ 05 39 35 60 54 · 05 39 95 91 16<br>✉️ zaidilabtanger@gmail.com · 🌐 www.zaidilab.com</p>
  </div>
  <div class="foot">ZaidiLab © Tanger</div>
</section>

<!-- TESTS -->
<section class="page" id="p-tests">
  <h2 class="t" data-i="tt"></h2>
  <p class="s" data-i="ts"></p>
  <input class="search" id="q" data-ph="tsearch" oninput="renderTests()">
  <div class="cat" id="cats"></div>
  <div id="list"></div>
</section>

<!-- REQUEST -->
<section class="page" id="p-request">
  <h2 class="t" data-i="rt"></h2>
  <p class="s" data-i="rs"></p>
  <div class="card">
    <label class="fl2" data-i="f_name"></label>
    <input class="fi" id="f-name" data-ph="ph_name" autocomplete="name">
    <label class="fl2" data-i="f_phone"></label>
    <input class="fi" id="f-phone" type="tel" placeholder="+212 6XX XXX XXX" autocomplete="tel">
    <label class="fl2" data-i="f_addr"></label>
    <input class="fi" id="f-addr" data-ph="ph_addr" autocomplete="street-address">
    <button class="gps" id="gps" onclick="getGPS()">📍 <span id="gps-t"></span></button>
    <label class="fl2" data-i="f_date"></label>
    <input class="fi" id="f-date" type="date">
    <label class="fl2" data-i="f_time"></label>
    <div class="slots" id="slots"></div>
    <label class="fl2" data-i="f_tests"></label>
    <div id="cartbox" style="margin-bottom:6px"></div>
    <button class="btn btn-l full" style="margin-bottom:12px" onclick="go('tests')">➕ <span data-i="f_add"></span></button>
    <label class="fl2" data-i="f_notes"></label>
    <textarea class="fi" id="f-notes" data-ph="ph_notes"></textarea>
    <div class="msg" id="rmsg"></div>
    <button class="btn btn-wa full" onclick="sendReq()">💬 <span data-i="f_send"></span></button>
    <p style="margin:2px 0 0;font-size:12px;text-align:center" data-i="f_hint"></p>
  </div>
</section>

<!-- GUIDE -->
<section class="page" id="p-guide">
  <h2 class="t" data-i="gt"></h2>
  <p class="s" data-i="gs"></p>
  <div id="acc"></div>
  <div class="note">⚠️ <span data-i="gdisc"></span></div>
</section>

<!-- ASSISTANT -->
<section class="page" id="p-ai">
  <h2 class="t">🤖 <span data-i="at"></span></h2>
  <p class="s" data-i="as"></p>
  <div class="chat" id="chat"></div>
  <div class="sug" id="sug"></div>
  <div class="send">
    <input class="fi" id="ai-in" data-ph="a_ph" onkeydown="if(event.key==='Enter')ask()">
    <button onclick="ask()">➤</button>
  </div>
  <div class="note" style="margin-top:4px">⚕️ <span data-i="adisc"></span></div>
</section>

</div>

<div class="pill" id="pill" onclick="go('request')"><span id="pill-t"></span><span>→</span></div>

<nav class="nav">
  <button data-p="home" onclick="go('home')"><i>🏡</i><span data-i="n1"></span></button>
  <button data-p="tests" onclick="go('tests')"><i>🧪</i><span data-i="n2"></span></button>
  <button class="mid" data-p="request" onclick="go('request')"><i>🏠</i><span data-i="n3"></span></button>
  <button data-p="guide" onclick="go('guide')"><i>📘</i><span data-i="n4"></span></button>
  <button data-p="ai" onclick="go('ai')"><i>🤖</i><span data-i="n5"></span></button>

const DEM=['🧪','🩸','⚖️','🛡️','🦠','🧫','🧬','🔬','👶'];

/* ====== STATE ====== */
let lang='fr',cat='all',cart=new Set(),slot='',gpsLink='',busy=false,hist=[];
try{lang=localStorage.getItem('zl_lang')||'fr';cart=new Set(JSON.parse(localStorage.getItem('zl_cart')||'[]'))}catch(e){}
if(!TR[lang])lang='fr';
const T=()=>TR[lang];
const $=id=>document.getElementById(id);
const saveCart=()=>{try{localStorage.setItem('zl_cart',JSON.stringify([...cart]))}catch(e){}};

/* ====== LANG ====== */
function setLang(l){
  lang=l;try{localStorage.setItem('zl_lang',l)}catch(e){}
  document.documentElement.lang=l;document.documentElement.dir=T().dir;
  document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  document.querySelectorAll('[data-i]').forEach(e=>{const v=T()[e.dataset.i];if(typeof v==='string')e.textContent=v});
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T()[e.dataset.ph]);
  $('gps-t').textContent=gpsLink?T().gps_ok:T().gps;
  renderAll();
}
function renderAll(){renderDiscs();renderSteps();renderCats();renderTests();renderSlots();renderCart();renderGuide();renderChatInit();renderStatus()}

/* ====== NAV ====== */
function go(p){
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  window.scrollTo({top:0,behavior:'smooth'});
  if(p==='request')renderCart();
  updatePill(p);
}
function updatePill(p){
  p=p||document.querySelector('.page.on').id.slice(2);
  const n=cart.size,tot=[...cart].reduce((s,i)=>s+A[i][2],0);
  $('pill').classList.toggle('on',n>0&&(p==='tests'));
  if(n>0)$('pill-t').textContent=T().pill(n,tot);
}

/* ====== HOME ====== */
function renderDiscs(){$('discs').innerHTML=T().dn.map((n,i)=>`<div class="disc"><i>${DEM[i]}</i>${n}</div>`).join('')}
function renderSteps(){$('steps').innerHTML=T().st.map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join('')}
function renderStatus(){
  const now=new Date(new Date().toLocaleString('en-US',{timeZone:'Africa/Casablanca'}));
  const d=now.getDay(),we=d===0||d===6,m=now.getHours()*60+now.getMinutes();
  const o=we?480:450,c=we?1080:1260,hm=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
  const open=m>=o&&m<c;
  $('dot').classList.toggle('off',!open);
  $('stat').textContent=open?`${T().open} · ${T().until} ${hm(c)}`:`${T().closed} · ${T().opens} ${hm(m<o?o:(((d+1)%7===0||(d+1)%7===6)?480:450))}`;
}

/* ====== TESTS ====== */
function renderCats(){
  const k=['all',...Object.keys(CAT)];
  $('cats').innerHTML=k.map(x=>`<button class="${x===cat?'on':''}" onclick="setCat('${x}')">${x==='all'?T().all:CAT[x]+' '+T().cats[x]}</button>`).join('');
}
function setCat(x){cat=x;renderCats();renderTests()}
function renderTests(){
  const q=($('q').value||'').toLowerCase().trim();
  const items=A.map((a,i)=>[a,i]).filter(([a])=>(cat==='all'||a[1]===cat)&&(a[0].toLowerCase().includes(q)||T().cats[a[1]].toLowerCase().includes(q)));
  $('list').innerHTML=items.length?items.map(([a,i])=>`<div class="test ${cart.has(i)?'sel':''}"><div class="ic">${CAT[a[1]]}</div><div class="in"><b>${a[0]}${a[3]?' ⭐':''}</b><small>${T().cats[a[1]]}</small></div><span class="price">${a[2]} MAD</span><button class="add" onclick="tog(${i})">${cart.has(i)?'✓':'+'}</button></div>`).join(''):`<p class="s" style="text-align:center;padding:30px">${T().none}</p>`;
}
function tog(i){cart.has(i)?cart.delete(i):cart.add(i);saveCart();renderTests();renderCart();updatePill()}

/* ====== REQUEST ====== */
function renderSlots(){
  const S=['07:30 – 09:30','09:30 – 11:30','11:30 – 13:30','14:00 – 16:00','16:00 – 18:00'];
  $('slots').innerHTML=S.map(s=>`<button class="slot ${s===slot?'on':''}" onclick="setSlot('${s}')">${s}</button>`).join('');
}
function setSlot(s){slot=slot===s?'':s;renderSlots()}
function renderCart(){
  const ids=[...cart];
  if(!ids.length){$('cartbox').innerHTML=`<p class="s" style="margin:0 0 8px">${T().cartempty}</p>`;return}
  const tot=ids.reduce((s,i)=>s+A[i][2],0);
  $('cartbox').innerHTML=ids.map(i=>`<div class="mini"><span>${A[i][0]} · <b>${A[i][2]} MAD</b></span><button onclick="tog(${i})">✕</button></div>`).join('')+`<div class="tot"><span>${T().total}</span><span>${tot} MAD</span></div>`;
}
function getGPS(){
  if(!navigator.geolocation){$('gps-t').textContent=T().gps_ko;return}
  $('gps-t').textContent=T().gps_w;
  navigator.geolocation.getCurrentPosition(p=>{
    gpsLink=`https://maps.google.com/?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;
    $('gps').classList.add('ok');$('gps-t').textContent=T().gps_ok;
  },()=>{$('gps-t').textContent=T().gps_ko},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function wa(text){window.open('https://wa.me/'+WA_NUM+(text?'?text='+encodeURIComponent(text):''),'_blank')}
function sendReq(){
  const n=$('f-name').value.trim(),p=$('f-phone').value.trim(),a=$('f-addr').value.trim(),d=$('f-date').value;
  const m=$('rmsg');
  if(!n||!p||!a||!d){m.textContent=T().f_err;m.className='msg err';return}
  m.className='msg';
  const ids=[...cart],tot=ids.reduce((s,i)=>s+A[i][2],0),notes=$('f-notes').value.trim();
  // message toujours en français pour l'équipe du laboratoire
  const msg=`Bonjour ZaidiLab 👋\n\n*Demande de prélèvement à domicile*\n👤 ${n}\n📞 ${p}\n🏠 ${a}\n📅 ${d}${slot?' · '+slot:''}`
   +(gpsLink?`\n📍 ${gpsLink}`:'')
   +(ids.length?`\n\n🔬 Analyses :\n${ids.map(i=>'• '+A[i][0]).join('\n')}\n💰 Total estimé : ${tot} MAD`:'')
   +(notes?`\n\n📝 ${notes}`:'')+`\n\n(Langue du patient : ${lang.toUpperCase()})`;
  if(SHEETS_URL.startsWith('https://')){
    try{fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({nom:n,tel:p,adresse:a,date:d,creneau:slot,gps:gpsLink,analyses:ids.map(i=>A[i][0]).join(', '),total:tot,notes:notes,langue:lang})})}catch(e){}
  }
  wa(msg);
}
(function(){const t=new Date();$('f-date').min=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')})();

/* ====== GUIDE ====== */
function renderGuide(){
  $('acc').innerHTML=T().g.map((g,i)=>`<div class="acc" id="ac${i}"><button class="q" onclick="document.getElementById('ac${i}').classList.toggle('open')"><span class="ei">${g[0]}</span>${g[1]}<span class="ar">▾</span></button><div class="a">${g[2]}</div></div>`).join('');
}

/* ====== ASSISTANT ====== */
function bub(t,c){const d=document.createElement('div');d.className='bub '+c;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=1e5;return d}
function renderChatInit(){
  $('chat').innerHTML='';hist=[];bub(T().a_hello,'bot');
  $('sug').innerHTML=T().chips.map(c=>`<button onclick="ask(this.textContent)">${c}</button>`).join('');
}
function localAnswer(q){
  q=q.toLowerCase();const K=T().kw;
  for(const k of Object.keys(K)){if(K[k].some(w=>q.includes(w))){
    if(/^\d+$/.test(k))return T().g[+k][2];
    return T().kb[k];
  }}
  return T().kb.def;
}
async function ask(text){
  const q=(text||$('ai-in').value).trim();if(!q||busy)return;
  $('ai-in').value='';bub(q,'me');hist.push({role:'user',content:q});
  busy=true;const th=document.createElement('div');th.className='bub bot typing';th.innerHTML='<span></span><span></span><span></span>';$('chat').appendChild(th);$('chat').scrollTop=1e5;
  let reply='';
  if(API_PROXY){
    try{
      const r=await fetch(API_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist.slice(-8),lang})});
      const j=await r.json();reply=j.reply||'';
    }catch(e){reply=''}
  }
  if(!reply)reply=localAnswer(q)+(API_PROXY?'':'');
  th.remove();bub(reply,'bot');hist.push({role:'assistant',content:reply});busy=false;
}

/* ====== INIT ====== */
setLang(lang);go('home');
setInterval(renderStatus,60000);
</script>
